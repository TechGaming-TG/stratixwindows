name: Build Stratix tvOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-device:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          xcodebuild -showsdks | grep -E 'tvOS|appletvos'

      - name: Resolve packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -workspace Stratix.xcworkspace \
            -scheme Stratix-Debug

      - name: Build for physical Apple TV
        run: |
          xcodebuild \
            -workspace Stratix.xcworkspace \
            -scheme Stratix-Debug \
            -sdk appletvos \
            -configuration Debug \
            -destination 'generic/platform=tvOS' \
            -derivedDataPath /tmp/stratix_device_build \
            -clonedSourcePackagesDirPath /tmp/stratix_device_build_spm \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package app
        run: |
          mkdir -p artifacts
          find /tmp/stratix_device_build/Build/Products \
            -type d \
            -name "*.app" \
            -exec cp -R {} artifacts/ \;

      - name: Upload device build
        uses: actions/upload-artifact@v4
        with:
          name: Stratix-tvOS-device-build
          path: artifacts/
